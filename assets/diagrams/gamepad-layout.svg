<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ctrlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="520" rx="14" fill="url(#ctrlBg)" stroke="#27354f" stroke-width="2"/>

  <!-- Title Header -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">ERGONOMIC GAMEPAD CONTROL MAPPING</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Standard Xbox / DualShock Layout • 3D Third-Person Cultural Action-Adventure</text>

  <!-- Stylized Gamepad Silhouette -->
  <g transform="translate(450, 270)">
    <!-- Controller Body -->
    <path d="M -160 -60 C -120 -80 120 -80 160 -60 C 220 -40 240 80 190 140 C 160 170 120 120 90 60 C 40 50 -40 50 -90 60 C -120 120 -160 170 -190 140 C -240 80 -220 -40 -160 -60 Z" fill="#1b2438" stroke="#374151" stroke-width="3"/>
    
    <!-- D-Pad -->
    <g transform="translate(-100, 30)">
      <rect x="-12" y="-35" width="24" height="70" rx="4" fill="#111827" stroke="#4b5563"/>
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#111827" stroke="#4b5563"/>
    </g>

    <!-- Left Thumbstick -->
    <circle cx="-60" cy="-20" r="28" fill="#111827" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="-60" cy="-20" r="14" fill="#1f2937"/>

    <!-- Right Thumbstick -->
    <circle cx="60" cy="30" r="28" fill="#111827" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="60" cy="30" r="14" fill="#1f2937"/>

    <!-- Face Buttons (X, Y, A, B) -->
    <g transform="translate(100, -20)">
      <circle cx="0" cy="-24" r="11" fill="#111827" stroke="#fbbf24" stroke-width="2"/> <!-- Y / Triangle -->
      <circle cx="24" cy="0" r="11" fill="#111827" stroke="#f43f5e" stroke-width="2"/> <!-- B / Circle -->
      <circle cx="0" cy="24" r="11" fill="#111827" stroke="#10b981" stroke-width="2"/> <!-- A / Cross -->
      <circle cx="-24" cy="0" r="11" fill="#111827" stroke="#60a5fa" stroke-width="2"/> <!-- X / Square -->
      
      <text x="0" y="-20" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800">Y</text>
      <text x="24" y="4" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="800">B</text>
      <text x="0" y="28" text-anchor="middle" fill="#10b981" font-size="11" font-weight="800">A</text>
      <text x="-24" y="4" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="800">X</text>
    </g>

    <!-- Bumpers & Triggers Indicators -->
    <rect x="-140" y="-85" width="60" height="16" rx="6" fill="#1f2937" stroke="#94a3b8"/>
    <rect x="80" y="-85" width="60" height="16" rx="6" fill="#1f2937" stroke="#94a3b8"/>
  </g>

  <!-- Left Callouts -->
  <!-- LT -->
  <g transform="translate(180, 115)">
    <rect x="-140" y="-18" width="140" height="36" rx="6" fill="#151e30" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="-70" y="5" text-anchor="middle" fill="#fcd34d" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">LT: FOCUS SPIRIT LENS</text>
    <line x1="0" y1="0" x2="160" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- LB -->
  <g transform="translate(180, 165)">
    <rect x="-140" y="-18" width="140" height="36" rx="6" fill="#151e30" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="-70" y="5" text-anchor="middle" fill="#22d3ee" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">LB: PARRY / GUARD</text>
    <line x1="0" y1="0" x2="150" y2="20" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Left Stick -->
  <g transform="translate(180, 245)">
    <rect x="-140" y="-18" width="140" height="36" rx="6" fill="#151e30" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="-70" y="5" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">L-STICK: MOVE / SPRINT</text>
    <line x1="0" y1="0" x2="210" y2="5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- D-Pad -->
  <g transform="translate(180, 325)">
    <rect x="-140" y="-18" width="140" height="36" rx="6" fill="#151e30" stroke="#10b981" stroke-width="1.5"/>
    <text x="-70" y="5" text-anchor="middle" fill="#6ee7b7" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">D-PAD: QUICK ITEMS</text>
    <line x1="0" y1="0" x2="170" y2="-25" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Right Callouts -->
  <!-- RT -->
  <g transform="translate(720, 115)">
    <rect x="0" y="-18" width="150" height="36" rx="6" fill="#151e30" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="5" text-anchor="middle" fill="#fda4af" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">RT: HEAVY SILAT STRIKE</text>
    <line x1="0" y1="0" x2="-160" y2="40" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- RB -->
  <g transform="translate(720, 165)">
    <rect x="0" y="-18" width="150" height="36" rx="6" fill="#151e30" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="75" y="5" text-anchor="middle" fill="#fda4af" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">RB: LIGHT KERIS SLASH</text>
    <line x1="0" y1="0" x2="-150" y2="20" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Face Buttons Action List -->
  <g transform="translate(720, 240)">
    <rect x="0" y="-30" width="150" height="95" rx="6" fill="#151e30" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="75" y="-10" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">Y: ROTATE PUZZLE</text>
    <text x="75" y="10" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">B: DODGE ROLL</text>
    <text x="75" y="30" text-anchor="middle" fill="#10b981" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">A: JUMP / VAULT</text>
    <text x="75" y="50" text-anchor="middle" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="11" font-weight="800">X: INTERACT / TALISMAN</text>
    <line x1="0" y1="20" x2="-170" y2="10" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Right Stick -->
  <g transform="translate(720, 360)">
    <rect x="0" y="-18" width="150" height="36" rx="6" fill="#151e30" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="75" y="5" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">R-STICK: CAMERA / LOCK-ON</text>
    <line x1="0" y1="0" x2="-210" y2="-60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Bottom Ergonomics Banner -->
  <rect x="180" y="460" width="540" height="36" rx="6" fill="#101726" stroke="#27354f"/>
  <text x="450" y="483" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Ergonomic Design Rationale: Combat triggers mapped to Index/Middle fingers; Movement &amp; Camera decouple thumb navigation.</text>
</svg>
