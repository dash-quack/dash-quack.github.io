<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="gameViewport" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
  </defs>

  <!-- 16:9 Viewport -->
  <rect width="960" height="540" rx="10" fill="url(#gameViewport)" stroke="#374151" stroke-width="2"/>

  <!-- Viewport Grid / Rule of Thirds Guideline (Subtle) -->
  <line x1="320" y1="0" x2="320" y2="540" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="640" y1="0" x2="640" y2="540" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="0" y1="180" x2="960" y2="180" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,6"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,6"/>

  <!-- Top Center: Diegetic Cultural Compass / Navigation Bar -->
  <g transform="translate(380, 25)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1.5"/>
    <line x1="100" y1="0" x2="100" y2="24" stroke="#f59e0b" stroke-width="2"/>
    <text x="100" y="16" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="bold">N • TEMPLE SPIRE (180m)</text>
  </g>

  <!-- Top Left: Vitality Status (Health Lotus & Stamina Crescent) -->
  <g transform="translate(40, 35)">
    <!-- Health Lotus Icon -->
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="20" y="24" text-anchor="middle" fill="#fb7185" font-size="14">✦</text>

    <!-- Health Bar -->
    <rect x="45" y="10" width="180" height="12" rx="4" fill="#1e293b"/>
    <rect x="45" y="10" width="145" height="12" rx="4" fill="#f43f5e"/>
    <text x="235" y="20" fill="#94a3b8" font-size="10">80/100 HP</text>

    <!-- Stamina Arc -->
    <rect x="45" y="27" width="130" height="8" rx="3" fill="#1e293b"/>
    <rect x="45" y="27" width="95" height="8" rx="3" fill="#10b981"/>
    <text x="185" y="34" fill="#94a3b8" font-size="9">STAMINA</text>
  </g>

  <!-- Center: Dynamic Context-Sensitive Reticle / Target Lock -->
  <g transform="translate(480, 270)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="3" fill="#06b6d4"/>
  </g>

  <!-- Mid-Bottom: Contextual Interaction Prompt -->
  <g transform="translate(480, 380)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">[E] / [X] INSPECT STONE ALTAR</text>
  </g>

  <!-- Bottom Left: Quick Relics & Potion D-Pad -->
  <g transform="translate(50, 440)">
    <circle cx="35" cy="35" r="30" fill="rgba(15, 23, 42, 0.7)" stroke="#334155" stroke-width="1.5"/>
    <rect x="25" y="25" width="20" height="20" rx="4" fill="#06b6d4" opacity="0.8"/>
    <text x="35" y="38" text-anchor="middle" fill="#ffffff" font-size="10">Herb</text>
    <text x="35" y="60" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">x3</text>
    <text x="80" y="40" fill="#94a3b8" font-size="10">[D-PAD UP]</text>
  </g>

  <!-- Bottom Right: Keris Aura Charge Gauge -->
  <g transform="translate(800, 440)">
    <!-- Keris Blade Glyph -->
    <circle cx="45" cy="35" r="32" fill="rgba(15, 23, 42, 0.8)" stroke="#f59e0b" stroke-width="3"/>
    <text x="45" y="38" text-anchor="middle" fill="#f59e0b" font-size="18">🗡️</text>
    <!-- Charge Arc Text -->
    <text x="45" y="55" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">100%</text>
    <text x="45" y="80" text-anchor="middle" fill="#fcd34d" font-size="9">[LB+RB] ULTIMATE</text>
  </g>

  <!-- Label Bar Overlay -->
  <rect x="0" y="505" width="960" height="35" fill="#0a0e17" opacity="0.95"/>
  <text x="480" y="527" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Minimalist Diegetic HUD Mockup • Dynamic Opacity: 100% during combat/puzzle, 20% during quiet exploration</text>
</svg>
