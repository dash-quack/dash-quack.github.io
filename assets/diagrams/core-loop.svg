<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="14" fill="url(#bgGrad)" stroke="#27354f" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" letter-spacing="1">HIKAYAT: CORE GAMEPLAY LOOP ARCHITECTURE</text>
  <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">BACS3233 Computer Game Design • Week 2 Systems Design</text>

  <!-- Central Emblem -->
  <circle cx="400" cy="245" r="48" fill="#131b2c" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)"/>
  <text x="400" y="240" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">PLAYER</text>
  <text x="400" y="258" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">FLOW STATE</text>

  <!-- Orbiting Nodes -->
  <!-- Node 1: Exploration (Top) -->
  <g transform="translate(400, 120)">
    <rect x="-95" y="-30" width="190" height="60" rx="10" fill="#151e30" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#22d3ee" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">1. SPATIAL EXPLORATION</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Temple Ruins, Landmarks, Verticality</text>
  </g>

  <!-- Node 2: Puzzle & Mystery (Right) -->
  <g transform="translate(630, 245)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#151e30" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#c084fc" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">2. SHADOW PUZZLES</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Wayang Puppetry &amp; Light Beams</text>
  </g>

  <!-- Node 3: Combat Encounter (Bottom) -->
  <g transform="translate(400, 370)">
    <rect x="-95" y="-30" width="190" height="60" rx="10" fill="#151e30" stroke="#f43f5e" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#fb7185" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">3. SILAT COMBAT / PARRY</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Shadow Minions, Rhythmic Timing</text>
  </g>

  <!-- Node 4: Cleansing & Rewards (Left) -->
  <g transform="translate(170, 245)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#151e30" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">4. SHRINE RESTORATION</text>
    <text x="0" y="14" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Spirit Shards, Blade Upgrades</text>
  </g>

  <!-- Curved Connecting Arrows -->
  <!-- 1 -> 2 (Top to Right) -->
  <path d="M 495 125 C 570 135 620 170 630 205" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 2 -> 3 (Right to Bottom) -->
  <path d="M 625 285 C 610 325 560 360 500 370" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 3 -> 4 (Bottom to Left) -->
  <path d="M 300 370 C 235 360 185 325 175 285" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- 4 -> 1 (Left to Top) -->
  <path d="M 175 205 C 190 165 240 135 300 125" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

</svg>
