<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    </pattern>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="920" height="560" rx="14" fill="url(#mapBg)" stroke="#27354f" stroke-width="2"/>
  <rect width="920" height="560" fill="url(#grid)" rx="14"/>

  <!-- Title & Legend -->
  <text x="460" y="38" text-anchor="middle" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">CHAPTER 1: THE SUNKEN RUINS OF SANTUBONG</text>
  <text x="460" y="58" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Top-Down Level Architectural Blueprint • Scale 1 grid = 5m</text>

  <!-- Level Layout Path (Critical Path) -->
  <!-- Zone 1: Entry Village -->
  <rect x="50" y="220" width="120" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="270" text-anchor="middle" fill="#34d399" font-family="'Outfit', sans-serif" font-size="12" font-weight="700">ZONE 1: PERMAI</text>
  <text x="110" y="288" text-anchor="middle" fill="#94a3b8" font-size="10">Spawn &amp; Tutorial</text>
  <circle cx="110" cy="245" r="8" fill="#10b981"/>

  <!-- Path 1 -> 2 -->
  <path d="M 170 280 L 250 280" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6,4"/>
  <text x="210" y="270" text-anchor="middle" fill="#22d3ee" font-size="10">Breadcrumbs</text>

  <!-- Zone 2: Ancient Courtyard (First Combat) -->
  <rect x="250" y="190" width="160" height="180" rx="8" fill="#172238" stroke="#f43f5e" stroke-width="2"/>
  <text x="330" y="240" text-anchor="middle" fill="#fda4af" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">ZONE 2: COURTYARD</text>
  <text x="330" y="260" text-anchor="middle" fill="#94a3b8" font-size="10">Combat Encounter (3 Minions)</text>
  <circle cx="300" cy="300" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="360" cy="300" r="10" fill="#f43f5e" opacity="0.6"/>
  <circle cx="330" cy="320" r="10" fill="#f43f5e" opacity="0.6"/>

  <!-- Fork: Optional Exploration Secret vs Critical Path -->
  <!-- Optional Secret Fork (Up) -->
  <path d="M 330 190 L 330 110 L 440 110" stroke="#a855f7" stroke-width="3" stroke-dasharray="4,4"/>
  <rect x="440" y="80" width="140" height="60" rx="6" fill="#241436" stroke="#a855f7" stroke-width="1.5"/>
  <text x="510" y="105" text-anchor="middle" fill="#d8b4fe" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">OPTIONAL: LORE CRYPT</text>
  <text x="510" y="122" text-anchor="middle" fill="#a855f7" font-size="9">Batik Mural + Health Lotus</text>

  <!-- Critical Path 2 -> 3 -->
  <path d="M 410 280 L 480 280" stroke="#06b6d4" stroke-width="4"/>

  <!-- Zone 3: Shadow Chamber (Puzzle Gate) -->
  <rect x="480" y="210" width="170" height="140" rx="8" fill="#172238" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="255" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">ZONE 3: WAYANG HALL</text>
  <text x="565" y="275" text-anchor="middle" fill="#94a3b8" font-size="10">Light Alignment Puzzle</text>
  <!-- Puzzle Mechanism -->
  <circle cx="565" cy="310" r="14" fill="#0d1424" stroke="#f59e0b" stroke-width="2"/>
  <text x="565" y="314" text-anchor="middle" fill="#fbbf24" font-size="10">⚙</text>

  <!-- Locked Gate Barrier -->
  <line x1="650" y1="240" x2="650" y2="320" stroke="#ef4444" stroke-width="5"/>
  <text x="645" y="230" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">LOCKED GATE</text>

  <!-- Path 3 -> 4 (After Puzzle Solved) -->
  <path d="M 650 280 L 730 280" stroke="#06b6d4" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Zone 4: Sanctum of the Keris (Boss Arena & Landmark) -->
  <circle cx="810" cy="280" r="70" fill="#1a1e33" stroke="#f59e0b" stroke-width="3" filter="url(#glowGold)"/>
  <text x="810" y="260" text-anchor="middle" fill="#fcd34d" font-family="'Outfit', sans-serif" font-size="12" font-weight="800">ZONE 4: SANCTUM</text>
  <text x="810" y="280" text-anchor="middle" fill="#f43f5e" font-size="10" font-weight="bold">BOSS: GARUDA SHADOW</text>
  <text x="810" y="300" text-anchor="middle" fill="#10b981" font-size="9">Cleansing Altar</text>

  <!-- Landmark Weenie Indicator (Visible throughout) -->
  <g transform="translate(810, 160)">
    <polygon points="0,-25 15,10 -15,10" fill="#f59e0b"/>
    <text x="0" y="25" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">TOWER VISTA WEENIE</text>
    <text x="0" y="38" text-anchor="middle" fill="#94a3b8" font-size="9">Spire visible across map</text>
  </g>

  <!-- Legend at Bottom -->
  <rect x="50" y="470" width="820" height="60" rx="8" fill="#111827" stroke="#27354f"/>
  <g transform="translate(80, 502)">
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
    <text x="12" y="4" fill="#94a3b8" font-size="11">Spawn / Safe Zone</text>
  </g>
  <g transform="translate(230, 502)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#06b6d4" stroke-width="3"/>
    <text x="35" y="4" fill="#94a3b8" font-size="11">Critical Path</text>
  </g>
  <g transform="translate(360, 502)">
    <circle cx="0" cy="0" r="6" fill="#f43f5e"/>
    <text x="12" y="4" fill="#94a3b8" font-size="11">Combat Encounter</text>
  </g>
  <g transform="translate(510, 502)">
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <text x="12" y="4" fill="#94a3b8" font-size="11">Puzzle Altar</text>
  </g>
  <g transform="translate(640, 502)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="30" y="4" fill="#94a3b8" font-size="11">Optional Secret Path</text>
  </g>
</svg>
